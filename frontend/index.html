<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pronto-Atendimento · Indicadores</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <nav class="lateral" aria-label="Menu principal">
      <div class="marca"><span class="cruz" aria-hidden="true">+</span>Pronto-Atendimento</div>
      <div class="marca-sub">Indicadores e estatísticas</div>
      <div id="menu"></div>
      <div class="legenda-cores" id="legenda" aria-label="Legenda das cores de risco"></div>
    </nav>

    <main>
      <header class="topo">
        <div class="relogio" aria-live="polite"><small>Relógio simulado</small><span id="hora">–</span></div>
        <div class="grupo" role="group" aria-label="Avançar relógio">
          <button class="btn peq" data-avancar="15">+15 min</button>
          <button class="btn peq" data-avancar="30">+30 min</button>
          <button class="btn peq" data-avancar="60">+1 h</button>
          <button class="btn peq" data-avancar="240">+4 h</button>
        </div>
        <div class="grupo">
          <label class="sr" for="definirHora">Definir data e hora</label>
          <input type="datetime-local" id="definirHora">
          <button class="btn peq" id="btnDefinir">Definir</button>
        </div>
        <div class="esp"></div>
        <button class="btn peq" id="btnReiniciar">Voltar para 10:46</button>
      </header>

      <div class="conteudo" id="conteudo" tabindex="-1"></div>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="mtitulo"></dialog>
  <div id="toasts" aria-live="polite" role="status"></div>
  <div id="tip" class="tip" hidden></div>

  <script src="js/graficos.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
